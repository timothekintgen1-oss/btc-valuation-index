name: Update valuation data

on:
  schedule:
    # Every 4 hours at :17. GitHub often delays or drops scheduled runs (especially
    # on the hour / half hour), so later slots catch up; a run with no new data
    # commits nothing. Coin Metrics publishes each day's data the next morning.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild composite
        run: python scripts/build_index.py

      - name: Commit data if it changed
        run: |
          git add data.json data/cache
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update $(date -u +%F)"
          git push
